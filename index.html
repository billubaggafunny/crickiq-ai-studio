<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>CrickIQ – Cricket Scorer & Analyst</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7300E0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="CrickIQ" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @font-face {
        font-family: "LatiniaBlack";
        src: url("/LatiniaBlack.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      @font-face {
        font-family: "SharpCardinal";
        src: url("/SharpCardinal.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      :root {
        --color-primary: #ffffff;
        --color-secondary: #f8f6fd;
        --color-tertiary: #f1f5f9;
        --color-text-primary: #111827;
        --color-text-secondary: #4B5563;
        --color-text-muted: #64748B;
        --color-text-disabled: #94A3B8;
        --color-highlight: #ef4444;
        --color-border: rgba(113, 147, 237, 0.15);
        --color-border-hover: rgba(113, 147, 237, 0.25);
        --color-border-strong: rgba(113, 147, 237, 0.35);
        --color-divider: rgba(113, 147, 237, 0.10);

        --color-accent: #2563eb; /* 4.5:1 contrast against white */
        --color-accent-light: #3b82f6;
        --color-accent-hover: #1d4ed8;
        --color-accent-surface: rgba(37, 99, 235, 0.05);

        --color-brand-teal: #0f766e; /* teal-700 */
        --color-brand-lightblue: #1d4ed8; /* blue-700 */
        --color-brand-blue: #4338ca; /* indigo-700 */
        --color-brand-lavender: #6d28d9; /* purple-700 */
        --color-success: #15803d; /* green-700 */
        --color-warning: #b45309; /* amber-700 */
        --color-danger: #b91c1c; /* red-700 */
        --color-info: #0369a1; /* sky-700 */
        --color-purple: #7e22ce;

        --color-live: #dc2626;
        --color-upcoming: #2563eb;
        --color-completed: #16a34a;
        --color-draft: #d97706;
        --color-abandoned: #4b5563;

        --brand-gradient: linear-gradient(90deg, #001e6b 0%, #0056ff 100%);

        /* Light Theme Foundation Tokens (Phase 1) */
        --color-light-primary-blue: #0056ff;
        --color-light-secondary-blue: #2277ff;
        --color-light-background: #f7f9fc;
        --color-light-card: #ffffff;
        --color-light-accent: #e3e7fc;
        --color-light-text-primary: #111827;
        --color-light-text-secondary: #4b5563;
        --color-light-border: #dce3f0;
        --color-light-success: #16a34a;
        --color-light-warning: #f59e0b;
        --color-light-error: #dc2626;
      }
      html.dark {
  --color-header: rgba(35, 38, 44, 0.92);
  --color-primary: #07111F;
  --color-secondary: #0F1B2D;
  --color-tertiary: #162338;

  --color-text-primary: #F8FAFC;
  --color-text-secondary: #CBD5E1;
  --color-text-muted: #94A3B8;
  --color-text-disabled: #64748B;

  --color-border: rgba(255, 255, 255, 0.08);
  --color-border-hover: rgba(255, 255, 255, 0.12);
  --color-border-strong: rgba(255, 255, 255, 0.16);
  --color-divider: rgba(255, 255, 255, 0.07);

  --color-accent: #22C55E;
  --color-accent-hover: #16A34A;
  --color-accent-light: #4ADE80;
  --color-accent-surface: rgba(34,197,94,0.12);

  --color-success: #22C55E;
  --color-warning: #F59E0B;
  --color-danger: #EF4444;
  --color-info: #3B82F6;
  --color-purple: #8B5CF6;

  --color-live: #EF4444;
  --color-upcoming: #3B82F6;
  --color-completed: #22C55E;
  --color-draft: #F59E0B;
  --color-abandoned: #6B7280;

  --color-brand-blue: var(--color-accent);
  --color-brand-lightblue: var(--color-accent-light);
  --color-brand-teal: var(--color-accent);
  --brand-gradient: linear-gradient(90deg, var(--color-accent-hover) 0%, var(--color-accent) 100%);
}

      /* Placeholders */
      ::placeholder {
        color: var(--color-text-secondary) !important;
        opacity: 1 !important;
      }

      /* Font size classes */
      html.font-size-small {
        font-size: 14px;
      }
      html.font-size-medium {
        font-size: 15px;
      }
      html.font-size-standard {
        font-size: 16px;
      }

      body {
        background-color: var(--color-secondary); /* Fallback */
        background-image: none;
        background-repeat: no-repeat;
        background-attachment: fixed;
        transition: background-image 0.5s ease-in-out;
        -webkit-user-select: none; /* Safari */
        -moz-user-select: none; /* Firefox */
        -ms-user-select: none; /* IE10+ */
        user-select: none; /* Standard */
      }
      html,
      body,
      #root {
        height: 100%;
      }
      .dark body {
        background-color: #111;
        background-image: none;
      }

      /* Base card style for glass effect */
      .glass-card {
        background-color: #ffffff;
        backdrop-filter: blur(10px);
        border-radius: 10px;
        border: 1px solid rgba(113, 147, 237, 0.1);
        box-shadow: none;
      }
      .dark .glass-card {
        background-color: rgba(31, 41, 55, 0.5);
      }

      /* Hide scrollbar utility */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none; /* IE and Edge */
        scrollbar-width: none; /* Firefox */
      }

      /* Allow text selection where needed */
      input,
      textarea,
      [contenteditable="true"] {
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        user-select: text;
      }

      @keyframes blink {
        50% {
          opacity: 0.3;
        }
      }
      .blinking {
        animation: blink 1s linear infinite;
      }

      /* Custom Checkbox styles */
      .custom-checkbox {
        display: inline-flex;
        align-items: center;
        cursor: pointer;
        user-select: none;
      }
      .custom-checkbox input {
        position: absolute;
        opacity: 0;
        cursor: pointer;
        height: 0;
        width: 0;
      }
      .custom-checkbox .checkmark {
        position: relative;
        height: 20px;
        width: 20px;
        background-color: var(--color-primary);
        border: 2px solid var(--color-border);
        border-radius: 3px;
        transition: background-color 0.2s;
        margin-right: 8px;
      }
      .custom-checkbox:hover input ~ .checkmark {
        background-color: rgba(0, 0, 0, 0.1);
      }
      .dark .custom-checkbox:hover input ~ .checkmark {
        background-color: rgba(255, 255, 255, 0.1);
      }
      .custom-checkbox input:checked ~ .checkmark {
        background-color: var(--color-accent);
        border-color: var(--color-accent);
      }
      .custom-checkbox.highlight input:checked ~ .checkmark {
        background-color: var(--color-highlight);
        border-color: var(--color-highlight);
      }
      .custom-checkbox .checkmark:after {
        content: "";
        position: absolute;
        display: none;
        left: 6px;
        top: 2px;
        width: 5px;
        height: 10px;
        border: solid white;
        border-width: 0 3px 3px 0;
        transform: rotate(45deg);
      }
      .custom-checkbox input:checked ~ .checkmark:after {
        display: block;
      }

      /* Dynamic Island Animation */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .animate-fade-in {
        animation: fadeIn 0.4s ease-out forwards;
      }

      /* Safe Area Insets */
      .safe-pad-t {
        padding-top: env(safe-area-inset-top);
      }
      .safe-pad-b {
        padding-bottom: env(safe-area-inset-bottom);
      }
      .safe-pad-l {
        padding-left: env(safe-area-inset-left);
      }
      .safe-pad-r {
        padding-right: env(safe-area-inset-right);
      }
      .safe-top-position {
        top: calc(1rem + env(safe-area-inset-top));
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          borderRadius: {
            none: "0px",
            sm: "1px",
            DEFAULT: "2px",
            md: "3px",
            lg: "4px",
            xl: "6px",
            "2xl": "8px",
            "3xl": "12px",
            full: "9999px",
            "20px": "10px",
          },
          extend: {
            backgroundImage: {
              "brand-gradient": "var(--brand-gradient)",
              futurewave: "linear-gradient(90deg, #2277FF 0%, #8DB8FF 100%)",
              "midnight-surge":
                "linear-gradient(90deg, #001E6B 0%, #0056FF 100%)",
            },
            fontSize: {
              h1: ["28px", { lineHeight: "36px", fontWeight: "700" }],
              h2: ["22px", { lineHeight: "30px", fontWeight: "600" }],
              h3: ["18px", { lineHeight: "26px", fontWeight: "600" }],
              body: ["16px", { lineHeight: "24px", fontWeight: "400" }],
              caption: ["13px", { lineHeight: "18px", fontWeight: "400" }],
              button: ["16px", { lineHeight: "20px", fontWeight: "600" }],
              tab: ["16px", { lineHeight: "normal", fontWeight: "600" }],
              "table-header": [
                "14px",
                { lineHeight: "normal", fontWeight: "600" },
              ],
              "table-cell": [
                "16px",
                { lineHeight: "normal", fontWeight: "500" },
              ],
              "table-secondary": [
                "13px",
                { lineHeight: "normal", fontWeight: "400" },
              ],
              "form-label": [
                "14px",
                { lineHeight: "normal", fontWeight: "500" },
              ],
              "form-input": [
                "16px",
                { lineHeight: "normal", fontWeight: "400" },
              ],
              "form-error": [
                "13px",
                { lineHeight: "normal", fontWeight: "500" },
              ],
              status: ["14px", { lineHeight: "normal", fontWeight: "600" }],
            },
            colors: {
              header: "var(--color-header)",
              "brand-teal": "var(--color-brand-teal)",
              "brand-lightblue": "var(--color-brand-lightblue)",
              "brand-blue": "var(--color-brand-blue)",
              "brand-lavender": "var(--color-brand-lavender)",
              success: "var(--color-success)",
              warning: "var(--color-warning)",
              danger: "var(--color-danger)",
              primary: "var(--color-primary)",
              secondary: "var(--color-secondary)",
              accent: "var(--color-accent)",
              highlight: "var(--color-highlight)",
              "text-primary": "var(--color-text-primary)",
              "text-secondary": "var(--color-text-secondary)",
              "border-color": "var(--color-border)",

              tertiary: "var(--color-tertiary)",
              "text-muted": "var(--color-text-muted)",
              "text-disabled": "var(--color-text-disabled)",
              border: "var(--color-border)",
              "border-hover": "var(--color-border-hover)",
              "border-strong": "var(--color-border-strong)",
              divider: "var(--color-divider)",
              "accent-hover": "var(--color-accent-hover)",
              "accent-light": "var(--color-accent-light)",
              "accent-surface": "var(--color-accent-surface)",
              info: "var(--color-info)",
              purple: "var(--color-purple)",
              live: "var(--color-live)",
              upcoming: "var(--color-upcoming)",
              completed: "var(--color-completed)",
              draft: "var(--color-draft)",
              abandoned: "var(--color-abandoned)",

              light: {
                "primary-blue": "var(--color-light-primary-blue)",
                "secondary-blue": "var(--color-light-secondary-blue)",
                background: "var(--color-light-background)",
                card: "var(--color-light-card)",
                accent: "var(--color-light-accent)",
                "text-primary": "var(--color-light-text-primary)",
                "text-secondary": "var(--color-light-text-secondary)",
                border: "var(--color-light-border)",
                success: "var(--color-light-success)",
                warning: "var(--color-light-warning)",
                error: "var(--color-light-error)",
              },
            },

            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ['"LatiniaBlack"', "sans-serif"],
              "sharp-cardinal": ['"SharpCardinal"', "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"

        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="bg-primary text-text-primary transition-colors duration-300 antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
